name: Practice 5 - REST API contract tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: practice-5-api-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare local Compose environment
        run: cp .env.example .env

      - name: Build and start SMP stack
        run: docker compose -f docker-compose.yaml -f docker-compose.practice5.yaml up -d --build

      - name: Wait for Gateway and downstream services
        shell: bash
        run: |
          for attempt in $(seq 1 120); do
            status="$(curl -sS -o /tmp/smp-health.json -w '%{http_code}' http://localhost:8080/health || true)"
            if [[ "$status" == "200" ]]; then
              cat /tmp/smp-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/smp-health.json || true
          docker compose -f docker-compose.yaml -f docker-compose.practice5.yaml ps
          exit 1

      - name: Wait for simulator services
        shell: bash
        run: |
          for port in 8085 8084; do
            ready=0
            for attempt in $(seq 1 120); do
              status="$(curl -sS -o /tmp/smp-simulator-health.json -w '%{http_code}' "http://localhost:${port}/health" || true)"
              if [[ "$status" == "200" ]]; then ready=1; break; fi
              sleep 2
            done
            if [[ "$ready" != "1" ]]; then
              cat /tmp/smp-simulator-health.json || true
              docker compose -f docker-compose.yaml -f docker-compose.practice5.yaml ps
              exit 1
            fi
          done

      - name: Run API tests three consecutive times
        shell: bash
        run: |
          for run in 1 2 3; do
            echo "Practice 5 API test run ${run}/3"
            mvn -B -f services/pom.xml -P api-tests verify
          done

      - name: Collect container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml -f docker-compose.practice5.yaml logs --no-color --tail=250

      - name: Upload API test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-5-api-test-reports
          path: |
            services/api-tests/target/surefire-reports/
            docs/practice-5/api-test-report.md
          if-no-files-found: warn

      - name: Stop SMP stack
        if: always()
        run: docker compose -f docker-compose.yaml -f docker-compose.practice5.yaml down --remove-orphans
